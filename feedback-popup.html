<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vayu Feedback & Profile</title>
  <style>
    :root {
      --primary-color: #2d6a4f;
      --accent-color: #d98253;
      --text-main: #0d1b2a;
      --text-muted: #5c677d;
      --bg-light: #fdfbf7;
      --border-color: rgba(0, 0, 0, 0.05);
    }
    
    body {
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .feedback-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: rgba(0, 0, 0, 0.12) 0px 1px 3px, rgba(0, 0, 0, 0.24) 0px 1px 2px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      height: 330px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    /* Top Close Button */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.8);
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background 0.2s;
    }
    .close-btn:hover {
      background: #f0f0f0;
    }
    .close-btn svg {
      stroke: #333;
    }

    .header-section {
      position: relative;
      height: 120px;
      background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0)) , url('profile_cover.png');
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid var(--border-color);
    }

    .profile-avatar-container {
      position: absolute;
      bottom: -32px;
      left: 20px;
      z-index: 2;
    }

    .profile-photo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background: #ffffff;
    }

    /* Card Content */
    .body-content {
      padding: 40px 20px 16px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .profile-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
    }

    .profile-email {
      font-size: 11px;
      color: var(--primary-color);
      font-weight: 600;
      margin: 2px 0 4px 0;
    }

    .profile-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin: 0 0 10px 0;
      line-height: 1.3;
    }

    /* Social Grid Layout */
    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      background: var(--bg-light);
      cursor: pointer;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-main);
      transition: background 0.2s, border-color 0.2s;
    }

    .social-btn:hover {
      background: #f0ede6;
      border-color: rgba(0, 0, 0, 0.12);
    }

    .social-btn svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .feedback-info-box {
      margin-top: auto;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(45, 106, 79, 0.05);
      border: 1px solid rgba(45, 106, 79, 0.1);
      font-size: 10.5px;
      text-align: center;
      color: var(--primary-color);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="feedback-card">
    <button class="close-btn" id="btn-close" title="Dismiss">
      <svg viewBox="0 0 10 10" width="10" height="10" stroke="currentColor" stroke-width="1.8" fill="none">
        <path d="M1,1 L9,9 M9,1 L1,9" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Header Image -->
    <div class="header-section">
      <div class="profile-avatar-container">
        <img src="profile_photo.png" alt="Pourush Siddharth" class="profile-photo">
      </div>
    </div>

    <!-- Content Section -->
    <div class="body-content">
      <h3 class="profile-name">Pourush Siddharth</h3>
      <div class="profile-email">pourushsiddharth@gmail.com</div>
      <p class="profile-desc">Vayu Browser Beta Tester & Developer</p>

      <!-- Social Links Grid -->
      <div class="social-grid">
        <!-- Website -->
        <button class="social-btn" id="btn-website">
          <svg width="12" height="12" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          Website
        </button>

        <!-- Mail -->
        <button class="social-btn" id="btn-mail">
          <svg width="12" height="12" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          Email
        </button>

        <!-- LinkedIn -->
        <button class="social-btn" id="btn-linkedin">
          <svg width="12" height="12" viewBox="0 0 24 24" style="fill: currentColor; stroke: none;">
            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
          </svg>
          LinkedIn
        </button>

        <!-- GitHub -->
        <button class="social-btn" id="btn-github">
          <svg width="12" height="12" viewBox="0 0 24 24" style="fill: currentColor; stroke: none;">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          GitHub
        </button>
      </div>

      <!-- Feedback Info Box -->
      <div class="feedback-info-box">
        <div style="font-weight: 700; margin-bottom: 2px;">Have feedback or ideas?</div>
        Drop a mail or send a DM on LinkedIn!
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    document.getElementById('btn-close').addEventListener('click', () => {
      window.close();
    });

    // Link events using create-tab ipc channel
    document.getElementById('btn-website').addEventListener('click', () => {
      ipcRenderer.send('create-tab', { url: 'https://pourushsiddharth.in', isIncognito: false });
      window.close();
    });

    document.getElementById('btn-mail').addEventListener('click', () => {
      ipcRenderer.send('create-tab', { url: 'mailto:pourushsiddharth@gmail.com', isIncognito: false });
      window.close();
    });

    document.getElementById('btn-linkedin').addEventListener('click', () => {
      ipcRenderer.send('create-tab', { url: 'https://www.linkedin.com/in/pourushsiddharth/', isIncognito: false });
      window.close();
    });

    document.getElementById('btn-github').addEventListener('click', () => {
      ipcRenderer.send('create-tab', { url: 'https://github.com/pourushsiddharth', isIncognito: false });
      window.close();
    });
  </script>
</body>
</html>
