<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vayu Lock Pointer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-top: 1px;
    }

    /* Pointing Up Arrow Tip aligned precisely with Vayu Lock Icon Center */
    .arrow-up {
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 9px solid #2d6a4f;
      margin-left: 55px;
      filter: drop-shadow(0 -2px 3px rgba(45, 106, 79, 0.4));
      position: relative;
      z-index: 2;
    }

    /* Vayu Ultra-Premium Widget Theme Card */
    .tooltip-card {
      position: relative;
      z-index: 1;
      margin-top: -1px;
      width: 295px;
      padding: 12px 14px;
      border-radius: 14px;
      background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.82) 0%, rgba(240, 253, 244, 0.72) 100%), url('vayu_widget.jpg');
      background-size: cover;
      background-position: bottom center;
      color: #0d1b2a;
      box-shadow: rgba(0, 0, 0, 0.12) 0px 1px 3px, rgba(0, 0, 0, 0.24) 0px 1px 2px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1.5px solid #2d6a4f;
      border-top: 2px solid #2d6a4f;
      animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(8px);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lock-icon-badge {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, rgba(45, 106, 79, 0.15) 0%, rgba(82, 183, 136, 0.25) 100%);
      border: 1px solid rgba(45, 106, 79, 0.3);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #2d6a4f;
      box-shadow: 0 2px 6px rgba(45, 106, 79, 0.15);
    }

    .tooltip-content {
      flex: 1;
    }

    .tooltip-title {
      font-size: 13px;
      font-weight: 700;
      color: #0d1b2a;
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: -0.2px;
    }

    .tooltip-desc {
      font-size: 11px;
      color: #475569;
      margin-top: 2px;
      line-height: 1.3;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="arrow-up"></div>
  <div class="tooltip-card">
    <div class="lock-icon-badge">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <div class="tooltip-content">
      <div class="tooltip-title" id="tooltip-title">Click Lock Icon Here</div>
      <div class="tooltip-desc" id="tooltip-desc">Turn on camera or microphone for this site</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const title = urlParams.get('title') || 'Click Lock Icon Here';
    const desc = urlParams.get('desc') || 'Turn on camera or microphone for this site';
    
    document.getElementById('tooltip-title').textContent = title;
    document.getElementById('tooltip-desc').textContent = desc;
  </script>
</body>
</html>
