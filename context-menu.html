<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vayu AI Context Menu</title>
  <style>
    :root {
      --bg: #ffffff;
      --border: rgba(0, 0, 0, 0.06);
      --item-hover: rgba(0, 0, 0, 0.05);
      --text: #0d1b2a;
      --text-muted: #4a5759;
      --accent: #2d6a4f;
      --accent-glow: rgba(45, 106, 79, 0.2);
      --sarvam-gradient: linear-gradient(135deg, #2d6a4f, #d98253);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: transparent;
      overflow: hidden;
      padding: 4px;
      height: 100vh;
      display: flex;
    }

    .menu-container {
      width: 100%;
      background: var(--bg);
      border: none;
      border-radius: 12px;
      box-shadow: rgba(0, 0, 0, 0.12) 0px 1px 3px, rgba(0, 0, 0, 0.24) 0px 1px 2px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 100%;
      overflow-y: auto;
    }

    /* Hide Scrollbar for clean UI */
    .menu-container::-webkit-scrollbar {
      display: none;
    }
    .menu-container {
      scrollbar-width: none;
    }

    .sarvam-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      margin-bottom: 3px;
    }

    .sarvam-tag {
      background: var(--sarvam-gradient);
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
      font-size: 9px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sarvam-dot {
      width: 5px;
      height: 5px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 6px #4ade80;
    }

    /* Skeleton Loading Animation */
    .skeleton-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 4px;
    }

    .skeleton-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(217, 130, 83, 0.05);
    }

    .skeleton-icon {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: rgba(217, 130, 83, 0.15);
    }

    .skeleton-text {
      height: 12px;
      border-radius: 3px;
      background: rgba(217, 130, 83, 0.15);
      flex: 1;
    }

    .shimmer {
      position: relative;
      overflow: hidden;
    }

    .shimmer::after {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0,
        rgba(255, 255, 255, 0.4) 20%,
        rgba(255, 255, 255, 0.6) 60%,
        rgba(255, 255, 255, 0)
      );
      animation: shimmer 1.4s infinite;
      content: '';
    }

    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    /* Menu Items */
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .menu-item:hover {
      background: var(--item-hover);
      color: var(--accent);
    }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-icon {
      width: 14px;
      height: 14px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }

    .menu-item:hover .menu-icon {
      stroke: var(--accent);
    }

    .shortcut {
      font-size: 10px;
      color: var(--text-muted);
    }

    .separator {
      height: 1px;
      background: var(--border);
      margin: 3px 0;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="menu-container" id="menu">
    <div style="display: flex; justify-content: center; align-items: center; padding: 4px 0 2px 0; gap: 8px;">
      <img src="powered_by_sarvam.png" alt="Powered by Sarvam AI" style="height: 10px; width: auto; object-fit: contain;">
    </div>
    <div class="separator" style="margin-top: 4px;"></div>

    <!-- Skeleton Shimmer Loader -->
    <div id="skeleton-loader" class="skeleton-container">
      <div class="skeleton-item"><div class="skeleton-icon shimmer"></div><div class="skeleton-text shimmer" style="width: 65%;"></div></div>
      <div class="skeleton-item"><div class="skeleton-icon shimmer"></div><div class="skeleton-text shimmer" style="width: 85%;"></div></div>
      <div class="skeleton-item"><div class="skeleton-icon shimmer"></div><div class="skeleton-text shimmer" style="width: 55%;"></div></div>
      <div class="skeleton-item"><div class="skeleton-icon shimmer"></div><div class="skeleton-text shimmer" style="width: 75%;"></div></div>
    </div>

    <!-- Real Content (Populated dynamically) -->
    <div id="menu-items" class="hidden"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const paramsData = JSON.parse(decodeURIComponent(urlParams.get('params') || '{}'));

    const menuItemsContainer = document.getElementById('menu-items');
    const skeletonLoader = document.getElementById('skeleton-loader');

    function createMenuItem(id, label, iconSvg, shortcut, action) {
      const div = document.createElement('div');
      div.className = 'menu-item';
      div.dataset.id = id;
      div.innerHTML = `
        <div class="menu-item-left">
          ${iconSvg}
          <span>${label}</span>
        </div>
        ${shortcut ? `<span class="shortcut">${shortcut}</span>` : ''}
      `;
      div.addEventListener('click', () => {
        if (window.api && window.api.send) {
          window.api.send('context-menu-action', { action, params: paramsData });
        }
      });
      return div;
    }

    function createSeparator() {
      const div = document.createElement('div');
      div.className = 'separator';
      return div;
    }

    // SVG icons helper
    const icons = {
      copy: `<svg class="menu-icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`,
      cut: `<svg class="menu-icon" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>`,
      paste: `<svg class="menu-icon" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>`,
      link: `<svg class="menu-icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>`,
      download: `<svg class="menu-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`,
      image: `<svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`,
      back: `<svg class="menu-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>`,
      forward: `<svg class="menu-icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`,
      reload: `<svg class="menu-icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>`,
      print: `<svg class="menu-icon" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>`,
      qr: `<svg class="menu-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>`,
      translate: `<svg class="menu-icon" viewBox="0 0 24 24"><path d="M5 8l6 6"></path><path d="M4 14e1 9.7 0 10 3 14 3 6.5 0 0 1 1 8"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="M22 22l-5-10-5 10"></path><path d="M14 18h6"></path></svg>`,
      code: `<svg class="menu-icon" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>`,
      inspect: `<svg class="menu-icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>`
    };

    function renderMenuItems(allowedFeatures) {
      menuItemsContainer.innerHTML = '';
      let addedAny = false;

      // 1. Text Selection Copy
      if (allowedFeatures.includes('copy') && !paramsData.isEditable && paramsData.selectionText && paramsData.selectionText.trim() !== '') {
        menuItemsContainer.appendChild(createMenuItem('copy', 'Copy', icons.copy, 'Ctrl+C', 'copy'));
        addedAny = true;
      }

      // 2. Link Options
      if (allowedFeatures.includes('link_options') && paramsData.linkURL) {
        menuItemsContainer.appendChild(createMenuItem('copy_link', 'Copy link address', icons.link, '', 'copy_link'));
        menuItemsContainer.appendChild(createMenuItem('save_link', 'Save link as...', icons.download, '', 'save_link'));
        addedAny = true;
      }

      // 3. Image Options
      if (allowedFeatures.includes('save_image') && (paramsData.mediaType === 'image' || (paramsData.srcURL && paramsData.mediaType !== 'none'))) {
        if (addedAny) menuItemsContainer.appendChild(createSeparator());
        menuItemsContainer.appendChild(createMenuItem('copy_image', 'Copy image', icons.image, '', 'copy_image'));
        menuItemsContainer.appendChild(createMenuItem('copy_image_addr', 'Copy image address', icons.link, '', 'copy_image_addr'));
        menuItemsContainer.appendChild(createMenuItem('save_image', 'Save image as...', icons.download, '', 'save_image'));
        addedAny = true;
      }

      // 4. Editable Text Tools
      if (paramsData.isEditable) {
        if (addedAny) menuItemsContainer.appendChild(createSeparator());
        if (paramsData.editFlags && paramsData.editFlags.canCut) menuItemsContainer.appendChild(createMenuItem('cut', 'Cut', icons.cut, 'Ctrl+X', 'cut'));
        if (paramsData.editFlags && paramsData.editFlags.canCopy) menuItemsContainer.appendChild(createMenuItem('copy_edit', 'Copy', icons.copy, 'Ctrl+C', 'copy'));
        if (paramsData.editFlags && paramsData.editFlags.canPaste) menuItemsContainer.appendChild(createMenuItem('paste', 'Paste', icons.paste, 'Ctrl+V', 'paste'));
        menuItemsContainer.appendChild(createMenuItem('select_all', 'Select All', icons.copy, 'Ctrl+A', 'select_all'));
        addedAny = true;
      }

      // 5. Standard Navigation
      if (addedAny) menuItemsContainer.appendChild(createSeparator());
      menuItemsContainer.appendChild(createMenuItem('back', 'Back', icons.back, 'Alt+←', 'back'));
      menuItemsContainer.appendChild(createMenuItem('forward', 'Forward', icons.forward, 'Alt+→', 'forward'));
      menuItemsContainer.appendChild(createMenuItem('reload', 'Reload', icons.reload, 'Ctrl+R', 'reload'));

      // 6. Extra Tools filtered by Sarvam AI
      menuItemsContainer.appendChild(createSeparator());
      if (allowedFeatures.includes('print')) menuItemsContainer.appendChild(createMenuItem('print', 'Print...', icons.print, 'Ctrl+P', 'print'));
      if (allowedFeatures.includes('qr_code')) menuItemsContainer.appendChild(createMenuItem('qr', 'Create QR Code for page', icons.qr, '', 'qr'));
      if (allowedFeatures.includes('translate')) menuItemsContainer.appendChild(createMenuItem('translate', 'Translate to English', icons.translate, '', 'translate'));

      menuItemsContainer.appendChild(createSeparator());
      if (allowedFeatures.includes('view_source')) menuItemsContainer.appendChild(createMenuItem('view_source', 'View page source', icons.code, 'Ctrl+U', 'view_source'));
      if (allowedFeatures.includes('inspect')) menuItemsContainer.appendChild(createMenuItem('inspect', 'Inspect', icons.inspect, '', 'inspect'));

      skeletonLoader.classList.add('hidden');
      menuItemsContainer.classList.remove('hidden');
    }

    // Default fast initial render if cached, or wait for IPC resolution from main process
    if (window.api && window.api.on) {
      window.api.on('sarvam-contextmenu-resolved', (allowedFeatures) => {
        renderMenuItems(allowedFeatures);
      });
    }

    // If initial fast render passed
    const initialAllowedStr = urlParams.get('allowed');
    if (initialAllowedStr) {
      try {
        const initialAllowed = JSON.parse(decodeURIComponent(initialAllowedStr));
        if (Array.isArray(initialAllowed) && initialAllowed.length > 0) {
          renderMenuItems(initialAllowed);
        }
      } catch(e) {}
    }
  </script>
</body>
</html>
